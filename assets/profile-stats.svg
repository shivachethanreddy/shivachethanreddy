<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="200"
     viewBox="0 0 700 200">

  <style>
    @keyframes gpsc-fade {
      from { opacity: 0 }
      to   { opacity: 1 }
    }

    @keyframes gpsc-pop {
      from {
        opacity: 0;
        transform: scale(.55)
      }
      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes gpsc-wipe {
      from {
        transform: translateX(calc(-1 * var(--gpsc-w,420px)))
      }
      to {
        transform: translateX(0)
      }
    }

    .gpsc-item {
      animation: gpsc-fade 1.2s ease both
                 calc(var(--gpsc-i,0) * .18s);
    }

    .arc {
      animation: gpsc-pop 1.2s ease both 1.35s;
      transform-box: fill-box;
      transform-origin: center;
    }

    .gpsc-reveal {
      animation: gpsc-wipe 1.8s linear both 1.2s;
    }

    @media (prefers-reduced-motion: reduce) {
      .gpsc-root,
      .gpsc-root *,
      .gpsc-item,
      .gpsc-chart,
      .arc,
      .gpsc-reveal {
        animation: none !important;
      }
    }

    * {
      font-family: 'Segoe UI', Ubuntu,
                   "Helvetica Neue", Sans-Serif;
    }
  </style>

  <g class="gpsc-root">

    <!-- Background -->
    <rect
      x="1"
      y="1"
      rx="5"
      height="99%"
      width="99.714%"
      stroke="#2e343b"
      stroke-width="1"
      fill="#0d1117"
    />

    <!-- Profile name -->
    <text
      x="30"
      y="40"
      class="gpsc-item"
      style="
        --gpsc-i:0;
        font-size:22px;
        fill:#40c463;
      "
    >
      shiva chetan reddy
    </text>

    <!-- Profile information -->
    <g transform="translate(0,40)">
      <g transform="translate(30,30)">

        <!-- Repository icon -->
        <g class="gpsc-item" style="--gpsc-i:0">
          <g
            transform="translate(0,0)"
            width="14"
            height="14"
            fill="#8b949e"
          >
            <path
              fill-rule="evenodd"
              d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 00.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"
            />
          </g>
        </g>

        <!-- Email icon -->
        <g class="gpsc-item" style="--gpsc-i:1">
          <g
            transform="translate(0,28)"
            width="14"
            height="14"
            fill="#8b949e"
          >
            <path
              fill-rule="evenodd"
              d="M1.75 2A1.75 1.75 0 000 3.75v.736a.75.75 0 000 .027v7.737C0 13.216.784 14 1.75 14h12.5A1.75 1.75 0 0016 12.25v-8.5A1.75 1.75 0 0014.25 2H1.75zM14.5 4.07v-.32a.25.25 0 00-.25-.25H1.75a.25.25 0 00-.25.25v.32L8 7.88l6.5-3.81zm-13 1.74v6.441c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V5.809L8.38 9.397a.75.75 0 01-.76 0L1.5 5.809z"
            />
          </g>
        </g>

        <!-- Location / web icon -->
        <g class="gpsc-item" style="--gpsc-i:2">
          <g
            transform="translate(0,56)"
            width="14"
            height="14"
            fill="#8b949e"
          >
            <path
              fill-rule="evenodd"
              d="M11.536 3.464a5 5 0 010 7.072L8 14.07l-3.536-3.535a5 5 0 117.072-7.072v.001zm1.06 8.132a6.5 6.5 0 10-9.192 0l3.535 3.536a1.5 1.5 0 002.122 0l3.535-3.536zM8 9a2 2 0 100-4 2 2 0 000 4z"
            />
          </g>
        </g>

        <!-- Link icon -->
        <g class="gpsc-item" style="--gpsc-i:3">
          <g
            transform="translate(0,84)"
            width="14"
            height="14"
            fill="#8b949e"
          >
            <path
              fill-rule="evenodd"
              d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"
            />
          </g>
        </g>

        <!-- Stats -->

        <text
          x="21"
          y="14"
          class="gpsc-item"
          style="
            --gpsc-i:0;
            fill:#77909c;
            font-size:14px;
          "
        >
          20 Public Repos
        </text>

        <text
          x="21"
          y="42"
          class="gpsc-item"
          style="
            --gpsc-i:1;
            fill:#77909c;
            font-size:14px;
          "
        >
          shivachethanreddy@gmail.com
        </text>

        <text
          x="21"
          y="70"
          class="gpsc-item"
          style="
            --gpsc-i:2;
            fill:#77909c;
            font-size:14px;
          "
        >
          github.com/shivachethanreddy
        </text>

        <text
          x="21"
          y="98"
          class="gpsc-item"
          style="
            --gpsc-i:3;
            fill:#77909c;
            font-size:14px;
          "
        >
          shivachethanreddy.work
        </text>

      </g>

      <!-- Contribution chart -->
      <g
        color="#40c463"
        transform="translate(295,10)"
      >

        <clipPath id="gpsc-reveal-clip">
          <rect
            class="gpsc-reveal"
            x="-30"
            y="0"
            width="410"
            height="110"
            style="--gpsc-w:410px"
          />
        </clipPath>

        <g
          clip-path="url(#gpsc-reveal-clip)"
          class="gpsc-chart"
        >

          <!-- Contribution area -->
          <path
            transform="translate(-30,0)"
            stroke="#40c463"
            fill="#40c463"
            opacity="1"
            d="
              M0,92
              C20,88 35,80 55,72
              C75,64 92,48 110,42
              C130,35 145,28 165,34
              C185,40 198,55 215,62
              C235,70 250,78 270,72
              C290,66 305,48 325,40
              C345,32 360,38 380,22
              L380,110
              L0,110
              Z
            "
          />

          <!-- Main contribution line -->
          <path
            class="arc"
            d="
              M0,92
              C20,88 35,80 55,72
              C75,64 92,48 110,42
              C130,35 145,28 165,34
              C185,40 198,55 215,62
              C235,70 250,78 270,72
              C290,66 305,48 325,40
              C345,32 360,38 380,22
            "
            fill="none"
            stroke="#40c463"
            stroke-width="2"
          />

        </g>

        <!-- X axis -->
        <g
          color="#77909c"
          transform="translate(-30,110)"
          fill="none"
          font-size="10"
          font-family="sans-serif"
          text-anchor="middle"
        >

          <path
            class="domain"
            stroke="currentColor"
            d="M0.5,6V0.5H380.5V6"
          />

          <text fill="currentColor" y="9" dy="0.71em">
            25/09
          </text>

          <text
            fill="currentColor"
            x="67"
            y="9"
            dy="0.71em"
          >
            25/11
          </text>

          <text
            fill="currentColor"
            x="137"
            y="9"
            dy="0.71em"
          >
            26/01
          </text>

          <text
            fill="currentColor"
            x="206"
            y="9"
            dy="0.71em"
          >
            26/03
          </text>

          <text
            fill="currentColor"
            x="277"
            y="9"
            dy="0.71em"
          >
            26/05
          </text>

          <text
            fill="currentColor"
            x="346"
            y="9"
            dy="0.71em"
          >
            26/07
          </text>

        </g>

        <!-- Y axis -->
        <g
          color="#77909c"
          transform="translate(350,0)"
          fill="none"
          font-size="10"
          font-family="sans-serif"
          text-anchor="start"
        >

          <path
            class="domain"
            stroke="currentColor"
            d="M6,110.5H0.5V0.5H6"
          />

          <text fill="currentColor" x="9" y="110">
            0
          </text>

          <text fill="currentColor" x="9" y="88">
            20
          </text>

          <text fill="currentColor" x="9" y="66">
            40
          </text>

          <text fill="currentColor" x="9" y="44">
            60
          </text>

          <text fill="currentColor" x="9" y="22">
            80
          </text>

          <text fill="currentColor" x="9" y="2">
            100
          </text>

        </g>

        <text
          y="-15"
          x="230"
          style="
            fill:#77909c;
            font-size:10px;
          "
        >
          contributions in the last year
        </text>

      </g>
    </g>
  </g>
</svg>
